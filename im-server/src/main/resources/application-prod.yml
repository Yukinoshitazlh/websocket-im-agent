# 生产环境强安全配置（启用方式：--spring.profiles.active=prod）
# 强制取消弱默认值：未配置关键环境变量时拒绝启动，避免误用默认密钥暴露公网。

server:
  address: ${SERVER_BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:im_agent_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:24}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

im:
  security:
    jwt-secret: ${JWT_SECRET}
    internal-token: ${IM_INTERNAL_TOKEN}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    auth:
      require-captcha: true
      require-email-code: ${AUTH_REQUIRE_EMAIL_CODE:true}
      mail-enabled: ${MAIL_ENABLED:true}
      dev-expose-email-code: false
      allow-demo-quick-login: false
      show-demo-mode: false
  storage:
    mode: ${STORAGE_MODE:LOCAL}
    local-dir: ${STORAGE_LOCAL_DIR:/var/lib/pulseim/uploads}
    minio-presigned-enabled: ${MINIO_PRESIGNED_ENABLED:true}
