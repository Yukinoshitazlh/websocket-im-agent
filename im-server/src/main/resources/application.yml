server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accept-count: 1000
    max-connections: 8192

spring:
  application:
    name: im-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:im_agent_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 16
      connection-timeout: 10000
      idle-timeout: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:im_redis_123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:im_admin}
    password: ${RABBITMQ_PASSWORD:im_mq_123456}
    cache:
      channel:
        size: 64

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

im:
  security:
    jwt-secret: ${JWT_SECRET:im-agent-local-dev-jwt-secret-key-32bytes!}
    jwt-expire-seconds: 604800
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    chat-bucket-capacity: ${CHAT_RL_CAPACITY:30}
    chat-refill-per-second: ${CHAT_RL_REFILL:8.0}
    agent-bucket-capacity: ${AGENT_RL_CAPACITY:5}
    agent-refill-per-second: ${AGENT_RL_REFILL:0.2}
    agent-daily-quota: ${AGENT_DAILY_QUOTA:100}
  storage:
    mode: ${STORAGE_MODE:AUTO}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    minio-endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
    minio-access-key: ${MINIO_ACCESS_KEY:im_minio_admin}
    minio-secret-key: ${MINIO_SECRET_KEY:im_minio_123456}
    minio-bucket: ${MINIO_BUCKET:im-files}
