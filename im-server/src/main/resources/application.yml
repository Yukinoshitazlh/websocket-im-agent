server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accept-count: 1000
    max-connections: 8192

spring:
  application:
    name: im-server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:im_agent_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 16
      connection-timeout: 10000
      idle-timeout: 300000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:im_redis_123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:im_admin}
    password: ${RABBITMQ_PASSWORD:im_mq_123456}
    cache:
      channel:
        size: 64

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

im:
  security:
    jwt-secret: ${JWT_SECRET:im-agent-local-dev-jwt-secret-key-32bytes!}
    jwt-expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
    internal-token: ${IM_INTERNAL_TOKEN:im-agent-local-dev-internal-token-32bytes!}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    auth:
      require-captcha: ${AUTH_REQUIRE_CAPTCHA:true}
      require-email-code: ${AUTH_REQUIRE_EMAIL_CODE:true}
      invite-code: ${AUTH_INVITE_CODE:}
      ws-ticket-ttl-seconds: ${AUTH_WS_TICKET_TTL_SECONDS:30}
      login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:15}
      ip-login-max-per-minute: ${AUTH_IP_LOGIN_MAX_PER_MIN:30}
      ip-register-max-per-hour: ${AUTH_IP_REGISTER_MAX_PER_HOUR:10}
      ip-email-code-max-per-hour: ${AUTH_IP_EMAIL_CODE_MAX_PER_HOUR:10}
      mail-enabled: ${MAIL_ENABLED:false}
      mail-from: ${MAIL_FROM:no-reply@pulseim.local}
      dev-expose-email-code: ${AUTH_DEV_EXPOSE_EMAIL_CODE:true}
      allow-demo-quick-login: ${AUTH_ALLOW_DEMO_QUICK_LOGIN:true}
      show-demo-mode: ${AUTH_SHOW_DEMO_MODE:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    chat-bucket-capacity: ${CHAT_RL_CAPACITY:30}
    chat-refill-per-second: ${CHAT_RL_REFILL:8.0}
    agent-bucket-capacity: ${AGENT_RL_CAPACITY:5}
    agent-refill-per-second: ${AGENT_RL_REFILL:0.2}
    agent-daily-quota: ${AGENT_DAILY_QUOTA:100}
    agent-global-daily-quota: ${AGENT_GLOBAL_DAILY_QUOTA:500}
  storage:
    mode: ${STORAGE_MODE:AUTO}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    minio-endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
    minio-public-base-url: ${MINIO_PUBLIC_BASE_URL:}
    minio-access-key: ${MINIO_ACCESS_KEY:im_minio_admin}
    minio-secret-key: ${MINIO_SECRET_KEY:im_minio_123456}
    minio-bucket: ${MINIO_BUCKET:im-files}
    minio-presigned-enabled: ${MINIO_PRESIGNED_ENABLED:false}
    minio-presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:3600}
