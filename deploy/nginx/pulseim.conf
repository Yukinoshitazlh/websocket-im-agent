# PulseIM 生产级 Nginx 反向代理模板（HTTPS + WSS + 内部接口隔离 + 双网关负载）
# 部署：cp deploy/nginx/pulseim.conf /etc/nginx/sites-available/pulseim.conf
# 替换 chat.example.com 为你的真实域名，再使用 certbot --nginx -d chat.example.com 自动签发免费证书

upstream pulseim_server {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream pulseim_ws_gateways {
    # 单网关部署保持 9001；若启用双网关滚动无感更新（im-gateway@1 + im-gateway@2），取消下面 9002 注释
    server 127.0.0.1:9001 max_fails=3 fail_timeout=15s;
    # server 127.0.0.1:9002 max_fails=3 fail_timeout=15s;
}

# HTTP 80 自动跳转 HTTPS 443
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    # 基础安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. 严禁公网访问内部服务调用与 Actuator 端点
    location ^~ /internal/ {
        return 403;
    }
    location ^~ /actuator/ {
        return 403;
    }

    # 2. WebSocket WSS 反向代理（关闭包含 ticket query 的访问日志，延长长连接超时）
    location = /ws {
        access_log off;
        proxy_pass http://pulseim_ws_gateways/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3. 安全文件下载/预览端点（强制 nosniff）
    location ^~ /uploads/ {
        proxy_pass http://pulseim_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. REST API 与前端 SPA 托管
    location / {
        proxy_pass http://pulseim_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
