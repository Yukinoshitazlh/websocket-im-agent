name: CI & Release

on:
  push:
    branches:
      - main
      - v2/production
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - v2/production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: Build Frontend, Run Tests & Package JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: im-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: im-web
        run: npm ci

      - name: Type-check and build frontend bundle
        working-directory: im-web
        run: npm run build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run all backend unit tests
        run: mvn -B test

      - name: Package executable Spring Boot JARs
        run: mvn -B package -DskipTests

      - name: Collect release artifacts and SHA-256 checksums
        run: |
          mkdir -p release-artifacts
          for module in im-server im-gateway im-agent; do
            jar_file=$(find "${module}/target" -maxdepth 1 -type f -name "${module}-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
            if [ -z "${jar_file}" ]; then
              echo "Error: executable JAR not found for ${module}" >&2
              exit 1
            fi
            cp "${jar_file}" release-artifacts/
          done
          (cd release-artifacts && sha256sum *.jar > SHA256SUMS.txt)
          ls -lh release-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulseim-artifacts
          path: release-artifacts/*
          retention-days: 14

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: pulseim-artifacts
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" release-artifacts/* \
              --title "PulseIM ${TAG_NAME}" \
              --generate-notes
          fi
