services:
  # 阶段 1～4 核心：在线路由表、未读数、幂等去重、短期对话记忆、限流
  redis:
    image: redis:7.2-alpine
    container_name: im-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-im_redis_123456}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-im_redis_123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 阶段 3～4 核心：IM 网关与 Agent 异步解耦、跨节点消息推送
  # 管理后台：http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: im-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-im_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-im_mq_123456}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 阶段 3 可选（启动方式：docker compose --profile rag up -d）
  # 轻量向量数据库，用于带会话权限隔离的群聊记忆 RAG 检索
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: im-qdrant
    restart: unless-stopped
    profiles: ["rag"]
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 对象存储 MinIO（图片/文件消息存储；避开网关 9001/9002，映射 9100 API 与 9101 控制台）
  # 启动方式：docker compose --profile storage up -d（未启动时后端自动无缝降级到本地 uploads 目录）
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: im-minio
    restart: unless-stopped
    profiles: ["storage"]
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-im_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-im_minio_123456}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
