server:
  port: ${AGENT_HTTP_PORT:8082}

spring:
  application:
    name: im-agent
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:im_agent_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:im_redis_123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:im_admin}
    password: ${RABBITMQ_PASSWORD:im_mq_123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

im:
  agent:
    llm-base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    llm-api-key: ${LLM_API_KEY:}
    llm-model: ${LLM_MODEL:deepseek-chat}
    max-steps: 5
    step-timeout-seconds: 30
    qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
